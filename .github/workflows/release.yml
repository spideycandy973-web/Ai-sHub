name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (protected CI secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.AISHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secret configured"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/aishub-release.jks

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed release APK
        env:
          AISHUB_KEYSTORE_PATH: ${{ runner.temp }}/aishub-release.jks
          AISHUB_KEYSTORE_PASSWORD: ${{ secrets.AISHUB_KEYSTORE_PASSWORD }}
          AISHUB_KEY_ALIAS: ${{ secrets.AISHUB_KEY_ALIAS }}
          AISHUB_KEY_PASSWORD: ${{ secrets.AISHUB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify identity, signature, digest
        run: |
          BT=$ANDROID_HOME/build-tools/35.0.0
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $BT/aapt dump badging "$APK" | grep -q "package: name='com.aishub'"
          $BT/aapt dump badging "$APK" | grep -q "application-label:'Ai'sHub'"
          $BT/apksigner verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          cp "$APK" "AisHub-${{ github.event.inputs.tag }}.apk"
          sha256sum "AisHub-${{ github.event.inputs.tag }}.apk" > "AisHub-${{ github.event.inputs.tag }}.apk.sha256"

      - name: Create GitHub Release with verified asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" \
            "AisHub-${{ github.event.inputs.tag }}.apk" \
            "AisHub-${{ github.event.inputs.tag }}.apk.sha256" \
            --title "Ai'sHub ${{ github.event.inputs.tag }}" \
            --notes-file docs/releases/RELEASE_NOTES.md \
            --target "${{ github.sha }}"

      - name: Clean up keystore
        if: always()
        run: rm -f $RUNNER_TEMP/aishub-release.jks
