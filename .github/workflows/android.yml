name: Build Ai'sHub APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'src/**'
      - 'android/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Copy web assets into the native project
        run: npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease || echo "release build skipped"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: AiHub-apk
          path: out/*.apk
          if-no-files-found: warn

      - name: Publish APK to the "builds" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=builds
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Ai'sHub builds" \
            --notes "Auto-built APKs from the latest commit. Package: com.aishub"
          for f in out/*.apk; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done
