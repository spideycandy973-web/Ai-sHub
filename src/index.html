<script>
/* Boot guard — plain ES5, no dependencies, runs before anything else.
   If the app cannot start (old WebView syntax error, bad bundle, crash) this shows
   the real reason on screen instead of leaving a blank white page. */
(function () {
  var shown = false;
  function panel(title, detail) {
    if (shown) return;
    shown = true;
    try {
      var d = document.createElement('div');
      d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;' +
        'background:#07070B;color:#EDEBFF;padding:26px 20px;overflow:auto;' +
        'font-family:-apple-system,Roboto,"Segoe UI",sans-serif;');
      var h = document.createElement('div');
      h.setAttribute('style', 'font-size:19px;font-weight:700;line-height:1.35;color:#FF7AB6;margin-bottom:12px;');
      h.textContent = title;
      var pre = document.createElement('pre');
      pre.setAttribute('style', 'white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55;' +
        'color:#B9B7D0;background:#12121C;border:1px solid #26263C;border-radius:12px;padding:12px;margin:0 0 14px;');
      pre.textContent = detail;
      var btn = document.createElement('button');
      btn.textContent = 'Reload';
      btn.setAttribute('style', 'display:inline-block;background:#7C5CFF;color:#fff;border:0;border-radius:11px;' +
        'padding:11px 20px;font-size:14px;font-weight:600;');
      btn.onclick = function () { location.reload(); };
      d.appendChild(h);
      d.appendChild(btn);
      document.body.insertBefore(d, document.body.firstChild);
      document.body.insertBefore(pre, btn);
    } catch (e) { /* nothing else we can do */ }
  }
  function detailOf(err) {
    if (!err) return 'Unknown error';
    var text = (err.name ? err.name + ': ' : '') + (err.message || String(err));
    if (err.stack) text += '\n\n' + String(err.stack).split('\n').slice(0, 4).join('\n');
    return text;
  }
  window.AIHUB_BOOT_ERROR = panel;
  window.addEventListener('error', function (e) {
    if (window.AIHUB_BOOTED) return;               // already running: not a blank screen
    panel("Ai'sHub could not start", detailOf(e.error) + (e.message && !e.error ? String(e.message) : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (window.AIHUB_BOOTED) return;
    panel("Ai'sHub hit an error before starting", detailOf(e.reason));
  });
  setTimeout(function () {
    if (window.AIHUB_BOOTED) return;
    var ua = navigator.userAgent || 'unknown';
    var webview = (ua.match(/Chrome\/[\d.]+/) || ['Chrome version unknown'])[0];
    panel("Ai'sHub did not finish starting", 'The page loaded but the app never became ready.\n\n' +
      webview + '\n' + ua);
  }, 9000);
})();
</script>
<div id="app" class="app-shell">
  <!-- ══ header ══ -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="Menu" data-i18n-aria="menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
    </button>
    <button class="brand-chip" id="btn-model-chip" aria-label="Choose model">
      <span class="brand-dot" id="brand-dot"></span>
      <span class="brand-text">
        <span class="brand-name" id="brand-name">Ai'sHub</span>
        <span class="brand-sub" id="model-chip">Local engine</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
    </button>
    <button class="icon-btn" id="btn-new-chat" aria-label="New chat" data-i18n-aria="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
    </button>
  </header>

  <main class="main" id="main">
    <!-- ══ chat screen ══ -->
    <section class="screen is-active" id="screen-chat" data-screen="chat">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-inner" id="chat-inner">
          <div class="welcome" id="welcome"></div>
          <div class="messages" id="messages" aria-live="polite"></div>
        </div>
      </div>
      <button class="scroll-down" id="btn-scroll-down" aria-label="Scroll to latest">
        <svg viewBox="0 0 24 24"><path d="M12 5v14m0 0 6-6m-6 6-6-6" /></svg>
      </button>
      <div class="composer-wrap">
        <div class="mode-switch" id="mode-switch" role="tablist">
          <button class="mode-tab is-active" data-mode="chat" role="tab">
            <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-3.2-6.4L21 4l-1.3 3.6A7.9 7.9 0 0 1 21 12Z" /><path d="M8 11h8M8 15h5" /></svg>
            <span data-i18n="chatMode">Chat</span>
          </button>
          <button class="mode-tab" data-mode="agent" role="tab">
            <svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M4.2 7.5l1.7 1M18.1 15.5l1.7 1M4.2 16.5l1.7-1M18.1 8.5l1.7-1" /><circle cx="12" cy="12" r="4.2" /><path d="M9.8 11.2h.01M14.2 11.2h.01" /></svg>
            <span data-i18n="agentMode">Agent</span>
          </button>
        </div>
        <div class="composer" id="composer">
          <button class="attach-btn" id="btn-attach" aria-label="Attach">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message" enterkeyhint="send"></textarea>
          <button class="send-btn" id="btn-send" aria-label="Send">
            <svg class="ic-send" viewBox="0 0 24 24"><path d="M4.5 12h14m0 0-6-6m6 6-6 6" /></svg>
            <svg class="ic-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5" /></svg>
          </button>
        </div>
        <div class="composer-hint" id="composer-hint"></div>
      </div>
    </section>

    <!-- ══ agent tasks screen ══ -->
    <section class="screen" id="screen-agent" data-screen="agent">
      <div class="scroll">
        <div class="page-head">
          <h2 data-i18n="agentTasks">Agent</h2>
          <p data-i18n="agentTasksSub">Give one goal — your agent plans, uses tools and reports back.</p>
        </div>
        <div id="agent-tasks"></div>
        <div class="card" id="agent-skill-card">
          <h3 data-i18n="skills">Skills</h3>
          <div class="chip-grid" id="skills-grid"></div>
        </div>
      </div>
    </section>

    <!-- ══ models screen ══ -->
    <section class="screen" id="screen-models" data-screen="models">
      <div class="scroll">
        <div class="page-head">
          <h2 data-i18n="models">Models</h2>
          <p><span id="models-count">0</span> <span data-i18n="modelsSub">models · auto-updated when new ones drop</span></p>
        </div>
        <div class="row-actions">
          <button class="btn btn-ghost" id="btn-sync-models">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg>
            <span data-i18n="syncModels">Sync</span>
          </button>
          <button class="btn btn-ghost" id="btn-add-model">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
            <span data-i18n="addCustom">Custom</span>
          </button>
        </div>
        <div class="segmented" id="models-filter">
          <button class="is-active" data-filter="all" data-i18n="all">All</button>
          <button data-filter="free" data-i18n="free">Free</button>
          <button data-filter="offline" data-i18n="offline">Offline</button>
          <button data-filter="vision" data-i18n="vision">Vision</button>
          <button data-filter="tools" data-i18n="tools">Tools</button>
        </div>
        <div class="search-field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
          <input id="models-search" placeholder="Search models or providers" />
        </div>
        <div id="models-list"></div>
      </div>
    </section>

    <!-- ══ prompts screen ══ -->
    <section class="screen" id="screen-prompts" data-screen="prompts">
      <div class="scroll">
        <div class="page-head">
          <h2 data-i18n="prompts">Prompts &amp; Assistants</h2>
          <p data-i18n="promptsSub">One tap to start with an expert setup.</p>
        </div>
        <div class="segmented" id="prompt-tabs">
          <button class="is-active" data-tab="assistants" data-i18n="assistants">Assistants</button>
          <button data-tab="prompts" data-i18n="library">Library</button>
        </div>
        <div id="prompts-list"></div>
      </div>
    </section>

    <!-- ══ settings screen ══ -->
    <section class="screen" id="screen-settings" data-screen="settings">
      <div class="scroll">
        <div class="page-head">
          <h2 data-i18n="settings">Settings</h2>
          <p data-i18n="settingsSub">Keys never leave this device.</p>
        </div>
        <div id="settings-body"></div>
      </div>
    </section>

  </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-screen="chat">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 1-3.2-6.4L21 4l-1.3 3.6A7.9 7.9 0 0 1 21 12Z" /><path d="M8 11h8M8 15h5" /></svg>
        <span data-i18n="chat">Chat</span>
      </button>
      <button class="tab" data-screen="agent">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" /><path d="M12 3v2m0 14v2M4.2 7.5l1.7 1M18.1 15.5l1.7 1M4.2 16.5l1.7-1M18.1 8.5l1.7-1" /></svg>
        <span data-i18n="agent">Agent</span>
      </button>
      <button class="tab" data-screen="models">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z" /><path d="m4 7.5 8 4.5 8-4.5M12 12v9" /></svg>
        <span data-i18n="models">Models</span>
      </button>
      <button class="tab" data-screen="prompts">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h7" /><circle cx="18" cy="18" r="3" /></svg>
        <span data-i18n="prompts">Prompts</span>
      </button>
      <button class="tab" data-screen="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
        <span data-i18n="settings">Settings</span>
      </button>
    </nav>

  <!-- ══ overlays ══ -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="icon-btn" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Chats">
    <div class="drawer-head">
      <div class="brand-row">
        <img src="logo.png" alt="" width="34" height="34" class="logo-img" />
        <div>
          <strong>Ai'sHub</strong>
          <small id="drawer-version">v__APP_VERSION__</small>
        </div>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
    </div>
    <button class="btn btn-primary btn-block" id="drawer-new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg><span data-i18n="newChat2">New chat</span>
    </button>
    <div class="search-field drawer-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
      <input id="chats-search" placeholder="Search chats" />
    </div>
    <div class="drawer-list" id="chats-list"></div>
    <div class="drawer-foot">
      <div class="status-line"><span class="status-dot" id="net-dot"></span><span id="net-label">Online · free models ready</span></div>
      <button class="link-btn" id="drawer-about" data-i18n="about">About Ai'sHub</button>
    </div>
  </aside>
  <div class="toast-host" id="toast-host"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden></div>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true">
    <h3 id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
  <div class="splash" id="splash">
    <img src="logo.png" alt="Ai'sHub" width="92" height="92" />
    <div class="splash-name">Ai'sHub</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>
